<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legacy IPTV</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Splash -->
<div id="splash">
    <img src="assets/images/logo.png" alt="Legacy IPTV Logo" class="logo">
    <p class="version">Versão 1.0</p>
</div>

<!-- Login -->
<div id="login-section" class="hidden">
    <h2>Entrar no Legacy IPTV</h2>
    <input type="text" id="username" placeholder="Usuário">
    <input type="password" id="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
    <p id="login-msg" class="error"></p>
</div>

<!-- Conteúdo -->
<div id="content" class="hidden">
    <nav class="menu">
        <button onclick="showSection('filmes')">🎬 Filmes</button>
        <button onclick="showSection('series')">📺 Séries</button>
        <button onclick="showSection('canais')">📡 Ao Vivo</button>
        <button onclick="showSection('favoritos')">⭐ Favoritos</button>
        <button onclick="showSection('cupons')">🎁 Cupons</button>
        <button onclick="goToPlanos()">💳 Recarga</button>
    </nav>

    <div id="player-section">
        <video id="player" controls></video>
    </div>

    <div id="items" class="cards-container"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
