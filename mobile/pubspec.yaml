name: legacy_iptv
description: Aplicativo Legacy IPTV - Filmes, Séries e Canais ao vivo.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  video_player: ^2.8.1
  chewie: ^1.7.0
  provider: ^6.1.2
  flutter_spinkit: ^5.2.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/background.jpg
    - assets/images/filmes/
    - assets/images/series/
    - assets/images/canais/
    - assets/icons/
